<svg xmlns="http://www.w3.org/2000/svg" viewBox="-140 -240 390 440" width="1560" height="1760">
  <defs>
    <linearGradient id="suitBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e4c00"/>
      <stop offset=".1" stop-color="#c89600"/>
      <stop offset=".3" stop-color="#ffd43a"/>
      <stop offset=".5" stop-color="#f6c524"/>
      <stop offset=".78" stop-color="#a87900"/>
      <stop offset=".95" stop-color="#4f3600"/>
      <stop offset="1" stop-color="#6a4a0c"/>
    </linearGradient>
    <radialGradient id="helmetShell" cx="36%" cy="30%" r="80%">
      <stop offset="0" stop-color="#fff0b3"/>
      <stop offset=".3" stop-color="#ffd43a"/>
      <stop offset=".7" stop-color="#c99300"/>
      <stop offset="1" stop-color="#5a3e00"/>
    </radialGradient>
    <linearGradient id="suitTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d0" stop-opacity=".45"/>
      <stop offset=".25" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".85" stop-color="#3a2600" stop-opacity=".35"/>
      <stop offset="1" stop-color="#2a1b00" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="limb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d5600"/>
      <stop offset=".35" stop-color="#ffd43a"/>
      <stop offset=".7" stop-color="#d9a400"/>
      <stop offset="1" stop-color="#5f4200"/>
    </linearGradient>
    <linearGradient id="limbV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d5600"/>
      <stop offset=".35" stop-color="#ffd43a"/>
      <stop offset=".7" stop-color="#d9a400"/>
      <stop offset="1" stop-color="#5f4200"/>
    </linearGradient>
    <radialGradient id="rubber" cx="35%" cy="28%" r="78%">
      <stop offset="0" stop-color="#6a707b"/>
      <stop offset=".5" stop-color="#2b2f37"/>
      <stop offset="1" stop-color="#0e1013"/>
    </radialGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a414d"/>
      <stop offset=".4" stop-color="#c9d2de"/>
      <stop offset=".6" stop-color="#9aa5b4"/>
      <stop offset="1" stop-color="#2a2f38"/>
    </linearGradient>
    <linearGradient id="steelRing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a515e"/>
      <stop offset=".3" stop-color="#e3e8ef"/>
      <stop offset=".7" stop-color="#8c96a6"/>
      <stop offset="1" stop-color="#3a414d"/>
    </linearGradient>
    <linearGradient id="steelV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f5f9"/>
      <stop offset=".45" stop-color="#9ea8b8"/>
      <stop offset="1" stop-color="#3a414d"/>
    </linearGradient>
    <linearGradient id="tape" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d949f"/>
      <stop offset=".35" stop-color="#f4f6f9"/>
      <stop offset=".7" stop-color="#c3c9d2"/>
      <stop offset="1" stop-color="#6c737e"/>
    </linearGradient>
    <radialGradient id="glowGrad">
      <stop offset="0" stop-color="#dcffbb" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#8dff5e" stop-opacity=".4"/>
      <stop offset="1" stop-color="#7dff6a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fcf2a"/>
      <stop offset=".5" stop-color="#c8ff9c"/>
      <stop offset="1" stop-color="#38b526"/>
    </linearGradient>
    <linearGradient id="glassH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".65"/>
      <stop offset=".25" stop-color="#fff" stop-opacity=".12"/>
      <stop offset=".75" stop-color="#fff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".5"/>
    </linearGradient>

    <filter id="fabric" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".03 .04" numOctaves="3" seed="7" result="wrinkle"/>
      <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="1" seed="2" result="weave"/>
      <feComposite in="wrinkle" in2="weave" operator="arithmetic" k1="0" k2=".85" k3=".15" k4="0" result="bump"/>
      <feDiffuseLighting in="bump" lighting-color="#fff" surfaceScale="1.7" diffuseConstant="1.05" result="lit">
        <feDistantLight azimuth="220" elevation="52"/>
      </feDiffuseLighting>
      <feComposite in="lit" in2="SourceGraphic" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="m"/>
      <feComposite in="m" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="sheen" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="b"/>
      <feSpecularLighting in="b" surfaceScale="8" specularConstant=".55" specularExponent="18" lighting-color="#fff6d8" result="s">
        <feDistantLight azimuth="225" elevation="55"/>
      </feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="si"/>
      <feComposite in="SourceGraphic" in2="si" operator="arithmetic" k1="0" k2="1" k3=".8" k4="0"/>
    </filter>
    <filter id="shellSheen" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="b"/>
      <feSpecularLighting in="b" surfaceScale="10" specularConstant=".9" specularExponent="28" lighting-color="#fff" result="s">
        <feDistantLight azimuth="225" elevation="58"/>
      </feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="si"/>
      <feComposite in="SourceGraphic" in2="si" operator="arithmetic" k1="0" k2="1" k3=".75" k4="0"/>
    </filter>
    <filter id="rubberSheen" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b"/>
      <feSpecularLighting in="b" surfaceScale="5" specularConstant=".8" specularExponent="30" lighting-color="#fff" result="s">
        <feDistantLight azimuth="225" elevation="55"/>
      </feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="si"/>
      <feComposite in="SourceGraphic" in2="si" operator="arithmetic" k1="0" k2="1" k3=".6" k4="0"/>
    </filter>
    <filter id="blur3" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur7" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="vialGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="suitShape" d="M-118 -70C-118 -150 -62 -192 -10 -192C48 -192 90 -150 90 -74C90 -44 98 -22 104 2C114 60 106 112 82 140L-80 140C-112 112 -126 60 -116 2C-112 -22 -118 -44 -118 -70Z"/>
    <clipPath id="suitClip"><use href="#suitShape"/></clipPath>
  </defs>

  <g transform="translate(0 -30)">
    <!-- ===== back: tank on the near (left) side, hose into the back of the hood ===== -->
    <rect x="-142" y="-50" width="40" height="150" rx="16" fill="url(#tank)"/>
    <rect x="-136" y="-42" width="6" height="134" rx="3" fill="#fff" opacity=".4"/>
    <g fill="#1d2129" opacity=".6"><rect x="-142" y="-12" width="40" height="6"/><rect x="-142" y="48" width="40" height="6"/></g>
    <g fill="url(#steelRing)"><rect x="-144" y="-16" width="44" height="8" rx="2"/><rect x="-144" y="44" width="44" height="8" rx="2"/></g>
    <rect x="-130" y="-64" width="16" height="16" rx="4" fill="url(#steelRing)"/>
    <path d="M-122 -64q-26 -56 18 -78" fill="none" stroke="#1a1d22" stroke-width="11" stroke-linecap="round"/>
    <path d="M-122 -64q-26 -56 18 -78" fill="none" stroke="#5a606b" stroke-width="9" stroke-linecap="round" stroke-dasharray="3 3"/>
    <path d="M-124 -66q-26 -56 18 -78" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".35"/>

    <!-- ===== legs (closer together: three-quarter view) ===== -->
    <g filter="url(#fabric)">
      <rect x="-68" y="118" width="54" height="62" rx="14" fill="url(#limb)"/>
      <rect x="4" y="118" width="52" height="62" rx="14" fill="url(#limb)"/>
    </g>
    <rect x="-68" y="118" width="54" height="62" rx="14" fill="url(#suitTop)"/>
    <rect x="4" y="118" width="52" height="62" rx="14" fill="url(#suitTop)"/>
    <g fill="url(#tape)"><rect x="-68" y="134" width="54" height="7"/><rect x="4" y="134" width="52" height="7"/></g>
    <g fill="#000" opacity=".25"><rect x="-68" y="141" width="54" height="2"/><rect x="4" y="141" width="52" height="2"/></g>
    <g filter="url(#rubberSheen)">
      <path d="M-78 170h70v16q0 12 -12 12h-46q-12 0 -12 -12z" fill="url(#rubber)"/>
      <path d="M-2 170h64v16q0 12 -12 12h-40q-12 0 -12 -12z" fill="url(#rubber)"/>
    </g>
    <g fill="#0b0c0f"><rect x="-78" y="192" width="70" height="6" rx="3"/><rect x="-2" y="192" width="64" height="6" rx="3"/></g>
    <g stroke="#9aa0ab" stroke-width="1.2" opacity=".5" fill="none"><path d="M-70 180h54M6 180h48"/></g>

    <!-- ===== one-piece hooded suit ===== -->
    <g filter="url(#fabric)"><use href="#suitShape" fill="url(#suitBody)"/></g>
    <g filter="url(#sheen)"><use href="#suitShape" fill="none"/></g>
    <use href="#suitShape" fill="url(#suitTop)"/>
    <g clip-path="url(#suitClip)">
      <!-- hood-to-body fold and quilting, curving with the turned body -->
      <g fill="none" stroke="#4a3200" stroke-opacity=".55" stroke-width="2.5">
        <path d="M-120 -32C-70 -4 50 -6 94 -40"/>
        <path d="M-118 36C-60 60 50 54 108 24M-112 100C-50 124 46 118 102 90"/>
      </g>
      <g fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1.2">
        <path d="M-120 -28C-70 0 50 -2 94 -36"/>
        <path d="M-118 40C-60 64 50 58 108 28M-112 104C-50 128 46 122 102 94"/>
      </g>
      <g fill="none" stroke="#3a2600" stroke-opacity=".55" stroke-width="1" stroke-dasharray="2.5 3">
        <path d="M-120 -38C-70 -10 50 -12 94 -46M-120 -24C-70 4 50 2 94 -32"/>
        <path d="M-118 30C-60 54 50 48 108 18M-118 44C-60 68 50 62 108 32M-112 94C-50 118 46 112 102 84M-112 108C-50 132 46 126 102 98"/>
        <path d="M-78 -8C-84 40 -82 90 -76 140M70 -14C80 40 82 90 72 140"/>
      </g>
      <!-- folds / ambient occlusion: far side darker, crease under the hood -->
      <path d="M60 -40C110 40 110 100 70 150L130 150L130 -60Z" fill="#000" opacity=".22" filter="url(#blur7)"/>
      <ellipse cx="-96" cy="50" rx="14" ry="60" fill="#000" opacity=".16" filter="url(#blur7)"/>
      <path d="M-120 -30C-70 -6 50 -8 94 -40" fill="none" stroke="#000" stroke-width="18" opacity=".35" filter="url(#blur7)"/>
      <ellipse cx="-40" cy="-176" rx="40" ry="10" fill="#fff" opacity=".22" filter="url(#blur7)"/>
      <path d="M100 -40q-30 70 -4 170" fill="none" stroke="#7dff6a" stroke-width="14" opacity=".2" filter="url(#blur7)"/>
      <!-- reflective tape band -->
      <path d="M-118 20C-60 44 50 38 108 8" fill="none" stroke="url(#tape)" stroke-width="8" opacity=".95"/>
      <path d="M-118 25C-60 49 50 43 108 13" fill="none" stroke="#000" stroke-width="2" opacity=".3"/>
    </g>
    <!-- zipper, offset to the turned chest -->
    <path d="M14 -4C22 40 24 86 20 126" fill="none" stroke="#4a3200" stroke-width="8" stroke-opacity=".55"/>
    <path d="M14 -4C22 40 24 86 20 126" fill="none" stroke="#d9b54a" stroke-width="4"/>
    <path d="M14 -4C22 40 24 86 20 126" fill="none" stroke="#8c6a12" stroke-width="1" stroke-dasharray="1.5 1.5"/>
    <rect x="13" y="112" width="14" height="16" rx="3" fill="url(#steelRing)"/>
    <rect x="16" y="128" width="8" height="10" rx="2" fill="#2b2f37"/>
    <!-- chest valve (near side) -->
    <circle cx="-54" cy="52" r="11" fill="url(#steelRing)"/>
    <circle cx="-54" cy="52" r="7" fill="#1a1d22"/>
    <circle cx="-54" cy="52" r="3" fill="#ff5f5f"/>
    <!-- chest patch -->
    <rect x="-18" y="55" width="70" height="42" rx="10" fill="#000" opacity=".3" filter="url(#blur3)" transform="skewY(-6)"/>
    <g transform="skewY(-6)">
      <rect x="-20" y="52" width="70" height="42" rx="10" fill="#f3f1e6"/>
      <rect x="-20" y="52" width="70" height="42" rx="10" fill="url(#suitTop)" opacity=".5"/>
      <rect x="-16" y="56" width="62" height="34" rx="7" fill="none" stroke="#2b2b33" stroke-width="1.2" stroke-dasharray="2 2" opacity=".6"/>
      <text x="15" y="85" text-anchor="middle" font-family="'Baloo 2', Arial, sans-serif" font-weight="800" font-size="29" fill="#232630">A·4</text>
    </g>

    <!-- ===== near (left) arm, resting ===== -->
    <rect x="-134" y="8" width="44" height="112" rx="21" fill="#000" opacity=".4" filter="url(#blur3)"/>
    <g filter="url(#fabric)"><rect x="-138" y="2" width="44" height="112" rx="21" fill="url(#limb)"/></g>
    <rect x="-138" y="2" width="44" height="112" rx="21" fill="url(#suitTop)"/>
    <rect x="-138" y="66" width="44" height="7" fill="url(#tape)"/>
    <path d="M-138 32q22 10 44 0" fill="none" stroke="#4a3200" stroke-opacity=".5" stroke-width="2"/>
    <g filter="url(#rubberSheen)"><circle cx="-116" cy="118" r="21" fill="url(#rubber)"/></g>
    <rect x="-136" y="100" width="40" height="8" rx="4" fill="url(#steelRing)"/>
    <path d="M-106 124q-6 8 -14 8" fill="none" stroke="#000" stroke-width="2" opacity=".4"/>

    <!-- ===== hood opening: rubber gasket around the visor, slightly right of the hood's centre ===== -->
    <ellipse cx="0" cy="-80" rx="74" ry="68" fill="#000" opacity=".4" filter="url(#blur3)"/>
    <ellipse cx="0" cy="-80" rx="73" ry="67" fill="none" stroke="#2a2d34" stroke-width="9"/>
    <ellipse cx="0" cy="-80" rx="77" ry="71" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="1.5"/>
    <ellipse cx="0" cy="-80" rx="73" ry="67" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="1.5" stroke-dasharray="2 4"/>
    <ellipse cx="0" cy="-80" rx="67" ry="61" fill="#0f1116"/>
    <!-- hood lamp on the near side -->
    <g transform="translate(-92 -118)">
      <circle r="11" fill="url(#steelV)"/>
      <circle r="7" fill="#dff6ff"/>
      <circle cx="-2" cy="-2" r="3" fill="#fff"/>
    </g>

    <!-- ===== far (right) arm raised, holding the vial ===== -->
    <path d="M78 16q58 -22 66 -84" fill="none" stroke="#000" stroke-opacity=".4" stroke-width="46" stroke-linecap="round" filter="url(#blur3)"/>
    <g filter="url(#fabric)"><path d="M74 12q58 -22 66 -84" fill="none" stroke="url(#limbV)" stroke-width="38" stroke-linecap="round"/></g>
    <path d="M74 12q58 -22 66 -84" fill="none" stroke="url(#suitTop)" stroke-width="38" stroke-linecap="round" opacity=".7"/>
    <path d="M72 6q48 -20 58 -72" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".3" filter="url(#blur3)"/>
    <path d="M112 -30l22 10" stroke="url(#tape)" stroke-width="7"/>
    <path d="M90 10q40 -16 46 -62" fill="none" stroke="#3a2600" stroke-width="1" stroke-dasharray="2.5 3" opacity=".6"/>
    <!-- vial + glow -->
    <circle cx="160" cy="-120" r="80" fill="url(#glowGrad)"/>
    <g filter="url(#vialGlow)"><rect x="151" y="-135" width="18" height="40" rx="9" fill="url(#liquid)"/></g>
    <rect x="148" y="-170" width="24" height="78" rx="12" fill="#e9fbff" opacity=".28"/>
    <rect x="148" y="-170" width="24" height="78" rx="12" fill="url(#glassH)"/>
    <rect x="151" y="-166" width="3.5" height="60" rx="1.75" fill="#fff" opacity=".8"/>
    <rect x="148" y="-170" width="24" height="78" rx="12" fill="none" stroke="#fff" stroke-width=".8" opacity=".5"/>
    <rect x="144" y="-176" width="32" height="12" rx="4" fill="#ff5f93"/>
    <rect x="144" y="-176" width="32" height="5" rx="2" fill="#fff" opacity=".45"/>
    <g fill="#eaffdc"><circle cx="160" cy="-108" r="3.5"/><circle cx="156" cy="-118" r="2.5"/><circle cx="164" cy="-126" r="2"/></g>
    <!-- glove -->
    <rect x="128" y="-66" width="40" height="9" rx="4" fill="url(#steelRing)" transform="rotate(-12 148 -62)"/>
    <g filter="url(#rubberSheen)"><circle cx="152" cy="-86" r="23" fill="url(#rubber)"/></g>
    <path d="M136 -100q6 -12 20 -12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".35"/>
    <path d="M140 -78q10 8 22 4" fill="none" stroke="#000" stroke-width="2.5" opacity=".45"/>
    <path d="M160 -70q8 -2 12 -10" fill="none" stroke="#000" stroke-width="2" opacity=".35"/>
    <path d="M74 12q58 -22 66 -84" fill="none" stroke="#7dff6a" stroke-width="12" stroke-linecap="round" opacity=".2" filter="url(#blur7)"/>
    <circle cx="160" cy="-92" r="14" fill="#7dff6a" opacity=".25" filter="url(#blur7)"/>
    <ellipse cx="66" cy="-100" rx="12" ry="34" fill="#7dff6a" opacity=".14" filter="url(#blur7)"/>
  </g>
</svg>
