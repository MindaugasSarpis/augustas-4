<svg xmlns="http://www.w3.org/2000/svg" viewBox="-140 -240 390 440" width="1560" height="1760">
  <defs>
    <linearGradient id="suitBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e4c00"/>
      <stop offset=".12" stop-color="#c89600"/>
      <stop offset=".34" stop-color="#ffd43a"/>
      <stop offset=".55" stop-color="#f9c91e"/>
      <stop offset=".8" stop-color="#b98700"/>
      <stop offset=".95" stop-color="#5f4200"/>
      <stop offset="1" stop-color="#7a5a10"/>
    </linearGradient>
    <radialGradient id="helmetShell" cx="36%" cy="30%" r="80%">
      <stop offset="0" stop-color="#fff0b3"/>
      <stop offset=".3" stop-color="#ffd43a"/>
      <stop offset=".7" stop-color="#c99300"/>
      <stop offset="1" stop-color="#5a3e00"/>
    </radialGradient>
    <linearGradient id="suitTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d0" stop-opacity=".45"/>
      <stop offset=".25" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".85" stop-color="#3a2600" stop-opacity=".35"/>
      <stop offset="1" stop-color="#2a1b00" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="limb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d5600"/>
      <stop offset=".35" stop-color="#ffd43a"/>
      <stop offset=".7" stop-color="#d9a400"/>
      <stop offset="1" stop-color="#5f4200"/>
    </linearGradient>
    <linearGradient id="limbV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d5600"/>
      <stop offset=".35" stop-color="#ffd43a"/>
      <stop offset=".7" stop-color="#d9a400"/>
      <stop offset="1" stop-color="#5f4200"/>
    </linearGradient>
    <radialGradient id="rubber" cx="35%" cy="28%" r="78%">
      <stop offset="0" stop-color="#6a707b"/>
      <stop offset=".5" stop-color="#2b2f37"/>
      <stop offset="1" stop-color="#0e1013"/>
    </radialGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a414d"/>
      <stop offset=".4" stop-color="#c9d2de"/>
      <stop offset=".6" stop-color="#9aa5b4"/>
      <stop offset="1" stop-color="#2a2f38"/>
    </linearGradient>
    <linearGradient id="steelRing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a515e"/>
      <stop offset=".3" stop-color="#e3e8ef"/>
      <stop offset=".7" stop-color="#8c96a6"/>
      <stop offset="1" stop-color="#3a414d"/>
    </linearGradient>
    <linearGradient id="steelV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f5f9"/>
      <stop offset=".45" stop-color="#9ea8b8"/>
      <stop offset="1" stop-color="#3a414d"/>
    </linearGradient>
    <linearGradient id="tape" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d949f"/>
      <stop offset=".35" stop-color="#f4f6f9"/>
      <stop offset=".7" stop-color="#c3c9d2"/>
      <stop offset="1" stop-color="#6c737e"/>
    </linearGradient>
    <radialGradient id="glowGrad">
      <stop offset="0" stop-color="#dcffbb" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#8dff5e" stop-opacity=".4"/>
      <stop offset="1" stop-color="#7dff6a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fcf2a"/>
      <stop offset=".5" stop-color="#c8ff9c"/>
      <stop offset="1" stop-color="#38b526"/>
    </linearGradient>
    <linearGradient id="glassH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".65"/>
      <stop offset=".25" stop-color="#fff" stop-opacity=".12"/>
      <stop offset=".75" stop-color="#fff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".5"/>
    </linearGradient>

    <filter id="fabric" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".03 .04" numOctaves="3" seed="7" result="wrinkle"/>
      <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="1" seed="2" result="weave"/>
      <feComposite in="wrinkle" in2="weave" operator="arithmetic" k1="0" k2=".85" k3=".15" k4="0" result="bump"/>
      <feDiffuseLighting in="bump" lighting-color="#fff" surfaceScale="1.7" diffuseConstant="1.05" result="lit">
        <feDistantLight azimuth="220" elevation="52"/>
      </feDiffuseLighting>
      <feComposite in="lit" in2="SourceGraphic" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="m"/>
      <feComposite in="m" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="sheen" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="b"/>
      <feSpecularLighting in="b" surfaceScale="8" specularConstant=".55" specularExponent="18" lighting-color="#fff6d8" result="s">
        <feDistantLight azimuth="225" elevation="55"/>
      </feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="si"/>
      <feComposite in="SourceGraphic" in2="si" operator="arithmetic" k1="0" k2="1" k3=".8" k4="0"/>
    </filter>
    <filter id="shellSheen" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="b"/>
      <feSpecularLighting in="b" surfaceScale="10" specularConstant=".9" specularExponent="28" lighting-color="#fff" result="s">
        <feDistantLight azimuth="225" elevation="58"/>
      </feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="si"/>
      <feComposite in="SourceGraphic" in2="si" operator="arithmetic" k1="0" k2="1" k3=".75" k4="0"/>
    </filter>
    <filter id="rubberSheen" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b"/>
      <feSpecularLighting in="b" surfaceScale="5" specularConstant=".8" specularExponent="30" lighting-color="#fff" result="s">
        <feDistantLight azimuth="225" elevation="55"/>
      </feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="si"/>
      <feComposite in="SourceGraphic" in2="si" operator="arithmetic" k1="0" k2="1" k3=".6" k4="0"/>
    </filter>
    <filter id="blur3" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur7" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="vialGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="torsoClip"><rect x="-96" y="-10" width="192" height="150" rx="58"/></clipPath>
  </defs>

  <g transform="translate(0 -30)">
    <!-- ===== back: tank, hose to the back of the helmet ===== -->
    <rect x="-128" y="-60" width="40" height="150" rx="16" fill="url(#tank)"/>
    <rect x="-122" y="-52" width="6" height="134" rx="3" fill="#fff" opacity=".4"/>
    <g fill="#1d2129" opacity=".6"><rect x="-128" y="-22" width="40" height="6"/><rect x="-128" y="38" width="40" height="6"/></g>
    <g fill="url(#steelRing)"><rect x="-130" y="-26" width="44" height="8" rx="2"/><rect x="-130" y="34" width="44" height="8" rx="2"/></g>
    <rect x="-116" y="-74" width="16" height="16" rx="4" fill="url(#steelRing)"/>
    <path d="M-108 -74q-24 -60 30 -82" fill="none" stroke="#1a1d22" stroke-width="11" stroke-linecap="round"/>
    <path d="M-108 -74q-24 -60 30 -82" fill="none" stroke="#5a606b" stroke-width="9" stroke-linecap="round" stroke-dasharray="3 3"/>
    <path d="M-110 -76q-24 -60 30 -82" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".35"/>

    <!-- ===== legs ===== -->
    <g filter="url(#fabric)">
      <rect x="-62" y="118" width="52" height="62" rx="14" fill="url(#limb)"/>
      <rect x="10" y="118" width="52" height="62" rx="14" fill="url(#limb)"/>
    </g>
    <rect x="-62" y="118" width="52" height="62" rx="14" fill="url(#suitTop)"/>
    <rect x="10" y="118" width="52" height="62" rx="14" fill="url(#suitTop)"/>
    <g fill="url(#tape)"><rect x="-62" y="134" width="52" height="7"/><rect x="10" y="134" width="52" height="7"/></g>
    <g fill="#000" opacity=".25"><rect x="-62" y="141" width="52" height="2"/><rect x="10" y="141" width="52" height="2"/></g>
    <g filter="url(#rubberSheen)">
      <path d="M-70 170h66v16q0 12 -12 12h-42q-12 0 -12 -12z" fill="url(#rubber)"/>
      <path d="M4 170h66v16q0 12 -12 12h-42q-12 0 -12 -12z" fill="url(#rubber)"/>
    </g>
    <g fill="#0b0c0f"><rect x="-70" y="192" width="66" height="6" rx="3"/><rect x="4" y="192" width="66" height="6" rx="3"/></g>
    <g stroke="#9aa0ab" stroke-width="1.2" opacity=".5" fill="none"><path d="M-62 180h50M12 180h50"/></g>

    <!-- ===== torso with rounded shoulders ===== -->
    <g filter="url(#fabric)">
      <rect x="-96" y="-10" width="192" height="150" rx="58" fill="url(#suitBody)"/>
    </g>
    <g filter="url(#sheen)"><rect x="-96" y="-10" width="192" height="150" rx="58" fill="none"/></g>
    <rect x="-96" y="-10" width="192" height="150" rx="58" fill="url(#suitTop)"/>
    <g clip-path="url(#torsoClip)">
      <g fill="none" stroke="#4a3200" stroke-opacity=".5" stroke-width="2.5">
        <path d="M-96 36q96 28 192 0M-96 100q96 28 192 0"/>
      </g>
      <g fill="none" stroke="#fff" stroke-opacity=".32" stroke-width="1.2">
        <path d="M-96 40q96 28 192 0M-96 104q96 28 192 0"/>
      </g>
      <g fill="none" stroke="#3a2600" stroke-opacity=".55" stroke-width="1" stroke-dasharray="2.5 3">
        <path d="M-96 33q96 28 192 0M-96 43q96 28 192 0M-96 97q96 28 192 0M-96 107q96 28 192 0"/>
        <path d="M-60 -10q-10 40 -8 80M60 -10q10 40 8 80"/>
      </g>
      <ellipse cx="-72" cy="60" rx="18" ry="60" fill="#000" opacity=".22" filter="url(#blur7)"/>
      <ellipse cx="74" cy="70" rx="14" ry="55" fill="#000" opacity=".18" filter="url(#blur7)"/>
      <!-- shadow cast by the helmet onto the shoulders -->
      <ellipse cx="0" cy="6" rx="86" ry="18" fill="#000" opacity=".5" filter="url(#blur7)"/>
      <path d="M100 0q-30 60 -10 130" fill="none" stroke="#7dff6a" stroke-width="14" opacity=".2" filter="url(#blur7)"/>
      <rect x="-96" y="18" width="192" height="8" fill="url(#tape)" opacity=".95"/>
      <rect x="-96" y="26" width="192" height="2" fill="#000" opacity=".3"/>
    </g>
    <!-- zipper -->
    <rect x="-4" y="30" width="8" height="96" rx="2" fill="#4a3200" opacity=".55"/>
    <rect x="-2" y="30" width="4" height="96" fill="#d9b54a"/>
    <path d="M-2 30v96" stroke="#8c6a12" stroke-width="1" stroke-dasharray="1.5 1.5"/>
    <rect x="-7" y="112" width="14" height="16" rx="3" fill="url(#steelRing)"/>
    <rect x="-4" y="128" width="8" height="10" rx="2" fill="#2b2f37"/>
    <!-- chest valve -->
    <circle cx="-58" cy="52" r="11" fill="url(#steelRing)"/>
    <circle cx="-58" cy="52" r="7" fill="#1a1d22"/>
    <circle cx="-58" cy="52" r="3" fill="#ff5f5f"/>
    <!-- chest patch -->
    <rect x="-34" y="55" width="72" height="42" rx="10" fill="#000" opacity=".3" filter="url(#blur3)"/>
    <rect x="-36" y="52" width="72" height="42" rx="10" fill="#f3f1e6"/>
    <rect x="-36" y="52" width="72" height="42" rx="10" fill="url(#suitTop)" opacity=".5"/>
    <rect x="-32" y="56" width="64" height="34" rx="7" fill="none" stroke="#2b2b33" stroke-width="1.2" stroke-dasharray="2 2" opacity=".6"/>
    <text x="0" y="85" text-anchor="middle" font-family="'Baloo 2', Arial, sans-serif" font-weight="800" font-size="29" fill="#232630">A·4</text>

    <!-- ===== left arm, resting ===== -->
    <rect x="-124" y="6" width="42" height="112" rx="20" fill="#000" opacity=".4" filter="url(#blur3)"/>
    <g filter="url(#fabric)"><rect x="-128" y="0" width="42" height="112" rx="20" fill="url(#limb)"/></g>
    <rect x="-128" y="0" width="42" height="112" rx="20" fill="url(#suitTop)"/>
    <rect x="-128" y="64" width="42" height="7" fill="url(#tape)"/>
    <path d="M-128 30q21 10 42 0" fill="none" stroke="#4a3200" stroke-opacity=".5" stroke-width="2"/>
    <g filter="url(#rubberSheen)"><circle cx="-107" cy="116" r="21" fill="url(#rubber)"/></g>
    <rect x="-126" y="98" width="38" height="8" rx="4" fill="url(#steelRing)"/>
    <path d="M-98 122q-6 8 -14 8" fill="none" stroke="#000" stroke-width="2" opacity=".4"/>

    <!-- ===== collar ring + helmet dome ===== -->
    <ellipse cx="0" cy="-4" rx="80" ry="18" fill="#000" opacity=".45" filter="url(#blur3)"/>
    <ellipse cx="0" cy="-8" rx="78" ry="16" fill="url(#steelRing)"/>
    <ellipse cx="0" cy="-10" rx="70" ry="10" fill="#15181d"/>
    <!-- dome -->
    <ellipse cx="0" cy="-88" rx="84" ry="84" fill="#000" opacity=".4" transform="translate(5 8)" filter="url(#blur7)"/>
    <g filter="url(#shellSheen)"><ellipse cx="0" cy="-88" rx="84" ry="84" fill="url(#helmetShell)"/></g>
    <ellipse cx="0" cy="-88" rx="84" ry="84" fill="url(#suitTop)" opacity=".6"/>
    <path d="M-62 -142q30 -34 72 -26" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".35" filter="url(#blur3)"/>
    <!-- dome seam and rivets -->
    <path d="M-84 -88a84 84 0 0 0 168 0" fill="none" stroke="#4a3200" stroke-opacity=".35" stroke-width="2"/>
    <path d="M-84 -86a84 84 0 0 0 168 0" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="1"/>
    <!-- helmet lamp -->
    <g transform="translate(-72 -122)">
      <circle r="11" fill="url(#steelV)"/>
      <circle r="7" fill="#dff6ff"/>
      <circle cx="-2" cy="-2" r="3" fill="#fff"/>
    </g>
    <!-- visor socket (face + visor layers sit on top) -->
    <ellipse cx="0" cy="-80" rx="67" ry="61" fill="#0f1116"/>
    <!-- front lip of the collar, over the dome base -->
    <path d="M-78 -8a78 16 0 0 0 156 0" fill="none" stroke="url(#steelRing)" stroke-width="10"/>
    <path d="M-72 -6a72 13 0 0 0 144 0" fill="none" stroke="#fff" stroke-width="1" opacity=".4"/>
    <path d="M-78 -8a78 16 0 0 0 156 0" fill="none" stroke="#000" stroke-width="1.5" opacity=".35"/>
    <g fill="#2a2f37"><circle cx="-56" cy="2" r="2.2"/><circle cx="-20" cy="7" r="2.2"/><circle cx="20" cy="7" r="2.2"/><circle cx="56" cy="2" r="2.2"/></g>

    <!-- ===== right arm raised, holding the vial ===== -->
    <path d="M84 14q60 -20 70 -80" fill="none" stroke="#000" stroke-opacity=".4" stroke-width="46" stroke-linecap="round" filter="url(#blur3)"/>
    <g filter="url(#fabric)"><path d="M80 10q60 -20 70 -80" fill="none" stroke="url(#limbV)" stroke-width="40" stroke-linecap="round"/></g>
    <path d="M80 10q60 -20 70 -80" fill="none" stroke="url(#suitTop)" stroke-width="40" stroke-linecap="round" opacity=".7"/>
    <path d="M78 4q50 -18 60 -70" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".3" filter="url(#blur3)"/>
    <path d="M118 -30l22 10" stroke="url(#tape)" stroke-width="7"/>
    <path d="M96 8q40 -14 48 -60" fill="none" stroke="#3a2600" stroke-width="1" stroke-dasharray="2.5 3" opacity=".6"/>
    <!-- vial + glow -->
    <circle cx="160" cy="-120" r="80" fill="url(#glowGrad)"/>
    <g filter="url(#vialGlow)"><rect x="151" y="-135" width="18" height="40" rx="9" fill="url(#liquid)"/></g>
    <rect x="148" y="-170" width="24" height="78" rx="12" fill="#e9fbff" opacity=".28"/>
    <rect x="148" y="-170" width="24" height="78" rx="12" fill="url(#glassH)"/>
    <rect x="151" y="-166" width="3.5" height="60" rx="1.75" fill="#fff" opacity=".8"/>
    <rect x="148" y="-170" width="24" height="78" rx="12" fill="none" stroke="#fff" stroke-width=".8" opacity=".5"/>
    <rect x="144" y="-176" width="32" height="12" rx="4" fill="#ff5f93"/>
    <rect x="144" y="-176" width="32" height="5" rx="2" fill="#fff" opacity=".45"/>
    <g fill="#eaffdc"><circle cx="160" cy="-108" r="3.5"/><circle cx="156" cy="-118" r="2.5"/><circle cx="164" cy="-126" r="2"/></g>
    <!-- glove -->
    <rect x="130" y="-66" width="40" height="9" rx="4" fill="url(#steelRing)" transform="rotate(-12 150 -62)"/>
    <g filter="url(#rubberSheen)"><circle cx="152" cy="-86" r="23" fill="url(#rubber)"/></g>
    <path d="M136 -100q6 -12 20 -12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".35"/>
    <path d="M140 -78q10 8 22 4" fill="none" stroke="#000" stroke-width="2.5" opacity=".45"/>
    <path d="M160 -70q8 -2 12 -10" fill="none" stroke="#000" stroke-width="2" opacity=".35"/>
    <path d="M80 10q60 -20 70 -80" fill="none" stroke="#7dff6a" stroke-width="12" stroke-linecap="round" opacity=".2" filter="url(#blur7)"/>
    <circle cx="160" cy="-92" r="14" fill="#7dff6a" opacity=".25" filter="url(#blur7)"/>
    <!-- green glint on the helmet from the vial -->
    <ellipse cx="62" cy="-110" rx="12" ry="30" fill="#7dff6a" opacity=".14" filter="url(#blur7)"/>
  </g>
</svg>
