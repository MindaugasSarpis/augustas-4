<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">

<title>Augustui 4!</title>
<meta property="og:title" content="Augustui 4! 🚀">
<meta property="og:description" content="Kvietimas į gimtadienio misiją – spalio 24 d., 15:30, Adventica (Ozas).">
<meta name="theme-color" content="#050816">

<style>
  :root {
    --space: #050816;
    --ink: #f4f6ff;
    --muted: #b9c2e6;
    --suit: #ffd23f;
    --glow: #7dff6a;
    --card: rgba(14, 20, 48, 0.82);
    --line: rgba(255, 255, 255, 0.14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--space);
    color: var(--ink);
    font-family: "Baloo 2", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #world {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh; height: 100dvh;
    display: block;
  }
  .ui { position: relative; z-index: 2; }

  /* Captions during the fly-out */
  #caption {
    position: fixed; left: 16px; right: 16px;
    bottom: calc(72px + env(safe-area-inset-bottom));
    text-align: center; z-index: 3;
    font-size: clamp(22px, 6.5vw, 34px); font-weight: 800; line-height: 1.15;
    text-shadow: 0 2px 12px rgba(0,0,0,.8), 0 0 2px #000;
    opacity: 0; transition: opacity .45s ease;
    pointer-events: none;
  }
  #caption.on { opacity: 1; }
  #skip {
    position: fixed; z-index: 4;
    right: 16px; top: calc(16px + env(safe-area-inset-top));
    background: rgba(0,0,0,.45); color: var(--ink);
    border: 1px solid var(--line); border-radius: 999px;
    font: inherit; font-size: 16px; padding: 6px 16px;
  }
  body.done #skip, body.done #caption { display: none; }

  /* Invitation card */
  #card {
    position: absolute; left: 0; right: 0;
    top: 54vh; top: 54dvh;
    margin: 0 auto 32px; width: min(460px, calc(100% - 32px));
    background: var(--card);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 24px;
    padding: 22px 20px 20px;
    opacity: 0; transform: translateY(40px);
    transition: opacity .8s ease, transform .8s ease;
    visibility: hidden;
  }
  body.done #card { opacity: 1; transform: none; visibility: visible; }
  @media (min-aspect-ratio: 1/1) {
    #card { top: 50%; left: auto; right: 6vw; margin: 0; transform: translateY(-40%); }
    body.done #card { transform: translateY(-50%); }
  }
  .kicker { margin: 0; color: var(--glow); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; }
  h1 { margin: 2px 0 6px; font-size: clamp(38px, 12vw, 54px); line-height: 1; font-weight: 800; }
  h1 span { color: var(--suit); }
  .lead { margin: 0 0 16px; color: var(--muted); font-size: 18px; line-height: 1.35; }
  dl { margin: 0 0 18px; display: grid; grid-template-columns: 34px 1fr; gap: 10px 8px; align-items: start; }
  dt { font-size: 22px; line-height: 1.2; text-align: center; }
  dd { margin: 0; font-size: 19px; line-height: 1.3; }
  dd small { display: block; color: var(--muted); font-size: 15px; }
  a { color: var(--ink); }
  .btn {
    display: block; width: 100%; text-align: center; text-decoration: none;
    background: var(--suit); color: #2a1d00;
    font-weight: 800; font-size: 21px; padding: 14px 16px; border-radius: 16px;
    box-shadow: 0 6px 0 #c99a00, 0 10px 24px rgba(255, 210, 63, .25);
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #c99a00; }
  .btn[aria-disabled="true"] { filter: grayscale(.6); opacity: .7; }
  .due { margin: 12px 0 0; text-align: center; color: var(--muted); font-size: 16px; }
  .row { display: flex; gap: 10px; margin-top: 16px; }
  .ghost {
    flex: 1; text-align: center; text-decoration: none;
    background: transparent; color: var(--ink);
    border: 1px solid var(--line); border-radius: 14px;
    font: inherit; font-size: 16px; padding: 9px 10px;
  }

  /* Small living details inside the SVG */
  .bubble { animation: rise 1.6s ease-in infinite; }
  .bubble:nth-child(2) { animation-delay: .5s; }
  .bubble:nth-child(3) { animation-delay: 1.05s; }
  @keyframes rise { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-46px); opacity: 0; } }
  .halo { animation: pulse 1.8s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { from { opacity: .55; transform: scale(.9); } to { opacity: 1; transform: scale(1.1); } }
  .land { animation: spin 90s linear infinite; }
  @keyframes spin { to { transform: translateX(-1200px); } }
  .tw { animation: tw 2.4s ease-in-out infinite alternate; }
  @keyframes tw { to { opacity: .2; } }
  .blink { animation: blink 1.2s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .15; } }
  @media (prefers-reduced-motion: reduce) {
    .bubble, .halo, .land, .tw, .blink { animation: none; }
  }
</style>
</head>

<div id="caption" class="ui" aria-live="polite"></div>

  <p class="lead">Mūsų mažasis mokslininkas švenčia gimtadienį ir kviečia prisijungti prie jo komandos!</p>

    <dt>📅</dt><dd>Šeštadienis, spalio 24 d.</dd>

<script>
  // Paste the Google Form link here (the "Send → link" URL).
  const FORM_URL = "";

  const rsvp = document.getElementById("rsvp");
  if (FORM_URL) rsvp.href = FORM_URL;
  else { rsvp.setAttribute("aria-disabled", "true"); rsvp.removeAttribute("target"); rsvp.onclick = e => { e.preventDefault(); alert("Registracijos nuoroda netrukus!"); }; }

  // Show the cartoon face only if the photo is missing.
  const probe = new Image();
  probe.onload = () => document.getElementById("cartoonFace").style.display = "none";
  probe.onerror = () => document.getElementById("photo").remove();
  probe.src = "augustas.jpg";

  const svg = document.getElementById("world");
  const root = document.getElementById("root");

  // Starfield: a wide sparse field plus a denser patch around the station.
  (function stars() {
    let seed = 4;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const g = document.getElementById("stars");
    const add = (cx, cy, r, tw) => {
      const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      c.setAttribute("cx", cx.toFixed(2)); c.setAttribute("cy", cy.toFixed(2));
      c.setAttribute("r", r.toFixed(2)); c.setAttribute("fill", "#fff");
      if (tw) { c.setAttribute("class", "tw"); c.style.animationDelay = (rnd() * 2.4).toFixed(2) + "s"; }
      g.appendChild(c);
    };
    for (let i = 0; i < 420; i++) add((rnd() - .5) * 6000, (rnd() - .5) * 6000, .8 + rnd() * 2.4, i % 10 === 0);
    for (let i = 0; i < 80; i++) add(180 + (rnd() - .5) * 400, -156 + (rnd() - .5) * 400, .25 + rnd() * .7, false);
  })();

  // Bounding box of an element in root (world) coordinates.
  function box(id) {
    const el = document.getElementById(id);
    const b = el.getBBox();
    const m = root.getScreenCTM().inverse().multiply(el.getScreenCTM());
    const pts = [[b.x, b.y], [b.x + b.width, b.y], [b.x, b.y + b.height], [b.x + b.width, b.y + b.height]]
      .map(([x, y]) => [m.a * x + m.c * y + m.e, m.b * x + m.d * y + m.f]);
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const x = Math.min(...xs), y = Math.min(...ys);
    return { x, y, w: Math.max(...xs) - x, h: Math.max(...ys) - y };
  }

  // A view is the top-left corner (x, y) plus k = world units per screen pixel.
  function fit(id, pad, W, H) {
    const b = box(id);
    const k = Math.max(b.w / W, b.h / H) * pad;
    return { x: b.x + b.w / 2 - W * k / 2, y: b.y + b.h / 2 - H * k / 2, k };
  }
  function finalView(W, H) {
    const b = box("earthFrame");
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    if (W >= H) {
      const k = Math.max(b.w / (W * .55), b.h / (H * .9));
      return { x: cx - W * .3 * k, y: cy - H * .5 * k, k };
    }
    const k = Math.max(b.w / W, b.h / (H * .5)) * 1.02;
    return { x: cx - W * .5 * k, y: cy - H * .27 * k, k };
  }

  let views, W, H;
  function measure() {
    W = innerWidth; H = innerHeight;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);  // reset so CTMs are sane
    views = {
      face: fit("visor", 1.12, W, H),
      lab: fit("labFrame", 1.0, W, H),
      station: fit("stationFrame", 1.15, W, H),
      end: finalView(W, H),
    };
  }
  function show(v) { svg.setAttribute("viewBox", `${v.x} ${v.y} ${W * v.k} ${H * v.k}`); }

  // Zoom about the single fixed point that maps view a onto view b.
  function between(a, b, u) {
    const k = a.k * Math.pow(b.k / a.k, u);
    const px = (b.x * a.k - a.x * b.k) / (a.k - b.k);
    const py = (b.y * a.k - a.y * b.k) / (a.k - b.k);
    return { x: px + (a.x - px) * k / a.k, y: py + (a.y - py) * k / a.k, k };
  }
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  const steps = [
    { hold: "face", dur: 1600, text: "Čia – Augustas." },
    { from: "face", to: "lab", dur: 2300, text: "Jis dirba slaptoje laboratorijoje…" },
    { hold: "lab", dur: 1300, text: "Jis dirba slaptoje laboratorijoje…" },
    { from: "lab", to: "station", dur: 2700, text: "…kuri yra kosminėje stotyje…" },
    { hold: "station", dur: 900, text: "…kuri yra kosminėje stotyje…" },
    { from: "station", to: "end", dur: 2600, text: "…skriejančioje aplink Žemę!" },
  ];
  const total = steps.reduce((s, x) => s + x.dur, 0);
  const caption = document.getElementById("caption");

  let start = 0, raf = 0, lastText = "";
  function frame(now) {
    let t = now - start;
    if (t >= total) return finish();
    for (const s of steps) {
      if (t < s.dur) {
        show(s.hold ? views[s.hold] : between(views[s.from], views[s.to], ease(t / s.dur)));
        if (s.text !== lastText) {
          caption.classList.remove("on");
          lastText = s.text;
          setTimeout(() => { caption.textContent = s.text; caption.classList.add("on"); }, lastText === steps[0].text ? 0 : 250);
        }
        break;
      }
      t -= s.dur;
    }
    raf = requestAnimationFrame(frame);
  }
  function finish() {
    cancelAnimationFrame(raf); raf = 0;
    show(views.end);
    document.body.classList.add("done");
  }
  function play() {
    document.body.classList.remove("done");
    scrollTo(0, 0);
    lastText = ""; caption.classList.remove("on");
    measure(); show(views.face);
    start = performance.now();
    raf = requestAnimationFrame(frame);
  }

  addEventListener("resize", () => {
    measure();
    if (!raf) show(views.end);
  });
  document.getElementById("skip").onclick = finish;
  document.getElementById("replay").onclick = play;

  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { measure(); finish(); }
  else play();
</script>
</body>
</html>
